name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Publish to repo.tommyjs.dev
        env:
          ORG_GRADLE_PROJECT_tommyjsUsername: ${{ secrets.NEXUS_USERNAME }}
          ORG_GRADLE_PROJECT_tommyjsPassword: ${{ secrets.NEXUS_PASSWORD }}
        run: ./gradlew publish -PreleaseVersion="${GITHUB_REF_NAME#v}"
